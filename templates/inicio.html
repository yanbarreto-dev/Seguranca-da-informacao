{% extends "base.html" %}{% block conteudo %}
{% if usuario %}
<h2>Olá, {{ usuario }}!</h2><p class="ok">Você está autenticado.</p>
<form method="post" action="/sair"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<button>Sair</button></form>
{% else %}<h2>Autenticação segura</h2><p>Faça o cadastro ou o login.</p>{% endif %}
{% endblock %}
