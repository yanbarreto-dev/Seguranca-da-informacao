{% extends "base.html" %}{% block conteudo %}
<h2>{{ titulo }}</h2>
{% if msg %}<p class="{{ 'ok' if ok else 'erro' }}">{{ msg }}</p>{% endif %}
<form method="post">
<input type="hidden" name="csrf" value="{{ csrf_token() }}">
<label>Usuário<input name="usuario" maxlength="32" required autocomplete="username"></label>
<label>Senha<input name="senha" type="password" maxlength="128" required
 autocomplete="{{ 'new-password' if titulo == 'Cadastro' else 'current-password' }}"></label>
<button>{{ botao }}</button>
</form>
{% endblock %}
